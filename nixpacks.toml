
[phases.setup]
nixPkgs = ['...', 'nodejs', 'python312', 'python312Packages.pip']

[phases.install]
cmds = ['cd frontend && npm install', 'pip install -r backend/requirements.txt']
dependsOn = ['setup']

[phases.build]
cmds = ['cd frontend && npm run build', 'cp -r frontend/dist backend/frontend_dist']
dependsOn = ['install']

[start]
cmd = 'cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT'

